
<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>

<style>
body {
    font-family: Arial;
    background: #f2f2f2;
}
form {
    width: 400px;
    margin: auto;
    padding: 20px;
    background: white;
}
label {
    display: inline-block;
    width: 120px;
}
input {
    margin: 5px;
    padding: 5px;
}
button {
    padding: 8px 15px;
    margin: 10px 5px;
    background: blue;
    color: white;
    border: none;
}
.buttons {
    text-align: center;
}
</style>
</head>

<body>

<form>
<h2 align="center">Student Registration</h2>

<label>First Name:</label>
<input type="text" id="fname"><br>

<label>Last Name:</label>
<input type="text" id="lname"><br>

<label>Roll Number:</label>
<input type="text" id="roll"><br>

<label>Email:</label>
<input type="text" id="email"><br>

<label>Mobile No:</label>
<input type="text" id="mobile"><br>

<label>Gender:</label>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<br><br>

<div class="buttons">
<button type="button" onclick="register()">Submit</button>
<button type="reset">Reset</button>
</div>
</form>

<script>
function register() {
    var f = document.getElementById("fname").value;
    var l = document.getElementById("lname").value;
    var r = document.getElementById("roll").value;
    var e = document.getElementById("email").value;
    var m = document.getElementById("mobile").value;
    var g = document.querySelector('input[name="gender"]:checked');

    if(f=="" || l=="" || r=="" || e=="" || m=="") {
        alert("Please fill all fields");
    }
    else if(e.indexOf("@")==-1 || e.indexOf(".")==-1) {
        alert("Enter a valid Email");
    }
    else if(m.length!=10 || isNaN(m)) {
        alert("Mobile Number must contain exactly 10 digits");
    }
    else if(g==null) {
        alert("Select Gender");
    }
    else {
        alert("Thank you for submitting");
    }
}
</script>

</body>
</html>
